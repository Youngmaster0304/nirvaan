services:
  - type: web
    name: railblock-ai
    runtime: python
    plan: free
    rootDir: backend_v2
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python seed_indian.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        value: sqlite:///./railvision.db
