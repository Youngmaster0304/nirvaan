services:
  - type: web
    name: railblock-ai
    runtime: python
    plan: free
    buildCommand: cd backend_v2 && pip install --upgrade pip && pip install -r requirements.txt
    startCommand: cd backend_v2 && python -c "from seed_indian import seed; seed()" && cd .. && uvicorn backend_v2.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        value: sqlite:///./railvision.db
